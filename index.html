<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e50914">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/50/e50914/book-stack.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/150/e50914/book-stack.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        /* --- DESIGN ORIGINAL PRESERVADO --- */
        #epubFileInput, #coverFileInput { display: none !important; }

        :root {
            --primary-red: #e50914;
            --dark-bg: #121212;
            --card-bg: #1f1f1f;
            --input-bg: #2d2d2d;
            --text-color: #fff;
            --light-text: #ccc;
        }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: var(--text-color);
            overflow-x: hidden;
        }

        .welcome-message {
            position: fixed;
            top: 25px;
            left: 20px;
            z-index: 10;
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--light-text);
        }

/* --- MODAL DE CONFIGURAÇÕES ESTILIZADO --- */
#settingsModal {
    display: none; /* Começa escondido */
    position: fixed;
    inset: 0; /* Ocupa a tela toda */
    z-index: 9999; /* Fica na frente de TUDO */
    background: rgba(0, 0, 0, 0.85); /* Fundo escuro semi-transparente */
    backdrop-filter: blur(8px); /* Efeito de vidro embaçado ao fundo */
    align-items: center;
    justify-content: center;
    padding: 20px;
}

/* Container do Modal */
.settings-content {
    background: #121212; /* Fundo idêntico ao menu lateral */
    width: 90%;
    max-width: 380px;
    border-radius: 32px;
    border: 1px solid #1f1f1f;
    padding: 30px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
}

/* Cards de Tema */
.theme-card {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 16px;
    border-radius: 18px;
    border: 2px solid transparent;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.2s ease;
}

.theme-card:active {
    transform: scale(0.98);
}

/* Destaque para o tema selecionado (Opcional: você pode adicionar via JS) */
.theme-card.selected {
    border-color: #e50914;
}

/* Estilo dos Botões de Tema dentro do Modal */
.theme-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.theme-btn {
    height: 45px;
    border-radius: 12px;
    border: 1px solid #444;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.2s;
}
        /* --- LOADING OVERLAY --- */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-bg);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: visible;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        #loadingOverlay.hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .loading-content {
            text-align: center;
            color: var(--text-color);
            font-size: 1.2rem;
            font-weight: 500;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333333;
            border-radius: 50%;
            border-top: 4px solid transparent;
            border-right: 4px solid var(--primary-red);
            margin: 0 auto 15px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #hero {
            position: relative;
            height: 400px;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)),
                        url('https://images.unsplash.com/photo-1512820790803-83ca734da794?q=80&w=1500&auto=format&fit=crop') center/cover no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.5);
        }

        .hero-content { max-width: 600px; }
        .hero-content h2 { font-size: 2.5rem; font-weight: 700; margin: 10px 0; }
        .hero-buttons { display: flex; justify-content: center; width: 100%; }
        .hero-content p { font-size: 1rem; font-weight: 400; margin-bottom: 30px; color: var(--light-text); }
        .hero-buttons button { padding: 10px 25px; margin: 0 10px; border: none; border-radius: 5px; font-weight: 500; cursor: pointer; transition: background-color 0.2s; }
        .hero-buttons .primary-btn { background-color: var(--text-color); color: var(--dark-bg); margin-left: 0px; }
        .hero-buttons .secondary-btn { background-color: rgba(255, 255, 255, 0.1); color: var(--text-color); border: 1px solid rgba(255, 255, 255, 0.3); }

        #top-utility-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #searchContainer {
            display: flex;
            align-items: center;
            background-color: rgba(45, 45, 45, 0.8);
            border-radius: 25px;
            padding: 5px 15px;
            backdrop-filter: blur(5px);
            width: 250px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .search-input {
            flex-grow: 1;
            background: transparent;
            border: none;
            color: var(--text-color);
            padding: 5px 0;
            font-size: 1rem;
            outline: none;
        }
        .search-input::placeholder { color: var(--light-text); opacity: 0.7; }

        .icon-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; display: none; transition: color 0.2s; }
        .icon-btn:hover { color: var(--primary-red); }

        #addBookBtn {
            background-color: var(--primary-red);
            color: var(--text-color);
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.4);
            transition: background-color 0.2s;
        }
        #addBookBtn:hover { background-color: #f87171; }

        #adminPanelBtn {
            background-color: #333; color: var(--text-color);
            padding: 10px 15px; border: 1px solid #444; border-radius: 5px; font-weight: 700; cursor: pointer;
            display: none; transition: all 0.2s;
        }
        #adminPanelBtn:hover { background-color: #444; border-color: var(--primary-red); }

        #logoutBtn { background: none; border: none; color: var(--light-text); cursor: pointer; font-size: 1.2rem; }

        #sidebar {
            position: fixed; top: 0; left: -320px; width: 280px; height: 100%;
            background-color: var(--card-bg); z-index: 2000;
            transition: left 0.3s ease; padding: 30px 20px;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5); visibility: hidden;
        }
        #sidebar.active { left: 0; visibility: visible; }
        .sidebar-item { display: flex; align-items: center; gap: 15px; padding: 15px; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; font-weight: 500; }
        .sidebar-item:hover { background: rgba(229, 9, 20, 0.1); color: var(--primary-red); }
        .admin-only-item { display: none; border: 1px solid rgba(229, 9, 20, 0.3); color: var(--primary-red); }
        #sidebarOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; z-index: 1999; backdrop-filter: blur(2px); }

.settings-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.settings-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px;
    background: #2a2a2a; /* Cor de fundo do item na foto */
    border-radius: 16px;
    color: white;
    cursor: pointer;
    transition: background 0.2s;
}

.settings-item:hover {
    background: #333;
}

.item-left {
    display: flex;
    align-items: center;
    gap: 15px;
    font-size: 1.1rem;
    font-weight: 600;
}

.item-left i {
    width: 25px;
    text-align: center;
    color: white;
}

.theme-sub-btn {
    width: 100%;
    padding: 14px;
    border-radius: 12px; /* Cantos arredondados como os itens principais */
    border: 1px solid rgba(255, 255, 255, 0.1);
    background-color: #2a2a2a; /* Cor cinza escuro da lista */
    color: #9ca3af;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s ease;
}
.theme-sub-btn:hover {
    background-color: #333;
    color: white;
    border-color: rgba(255, 255, 255, 0.2);
}
/* Feedback visual de clique */
.theme-sub-btn:active {
    transform: scale(0.97);
}

/* Estilo específico para cada cor de tema (Opcional, dá um charme extra) */
.theme-sub-btn[onclick*="dark"] { border-left: 4px solid #444; }
.theme-sub-btn[onclick*="sepia"] { border-left: 4px solid #d2c29d; }
.theme-sub-btn[onclick*="light"] { border-left: 4px solid #fff; }



/* Overlay para centralizar o modal na tela */
.settings-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0, 0, 0, 0.85);
    backdrop-filter: blur(8px);
    align-items: center;
    justify-content: center;
}

/* O container do sub-menu com animação de expansão */
.submenu-container {
    padding-left: 3rem;
    padding-right: 1rem;
    padding-top: 0.5rem;
    padding-bottom: 0.5rem;
    background-color: rgba(0, 0, 0, 0.2);
    border-radius: 0.75rem;
    margin-top: 0.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    overflow: hidden;
    transition: all 0.3s ease-in-out;
}

/* Estilo do botão de salvar baseado no design da STAANT */
.save-settings-btn {
    width: 100%;
    margin-top: 2rem;
    background-color: #e50914;
    color: white;
    padding: 1rem;
    border-radius: 1rem;
    font-weight: bold;
    transition: all 0.2s;
}

.save-settings-btn:active {
    transform: scale(0.95);
}

/* --- SIDEBAR DESIGN (PENTE FINO) --- */
.sidebar-modern {
    background-color: #121212; /* Fundo idêntico à imagem */
    width: 280px;
    height: 100vh;
    position: fixed;
    top: 0;
    left: -280px; /* Começa escondida */
    z-index: 1000;
    transition: left 0.3s ease;
    border-right: 1px solid #1f1f1f;
    padding: 20px 0;
}

.sidebar-modern.active {
    left: 0;
}

.menu-title {
    color: #e50914; /* Vermelho do Projeto Tixan */
    font-size: 1.25rem;
    font-weight: bold;
    padding: 0 24px;
    margin-bottom: 20px;
}

.sidebar-btn {
    display: flex;
    align-items: center;
    gap: 15px;
    width: 100%;
    padding: 16px 24px;
    background: transparent;
    border: none;
    color: white;
    font-size: 1rem;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
}

.sidebar-btn:hover {
    background: rgba(255, 255, 255, 0.05);
}

.sidebar-btn i {
    font-size: 1.2rem;
    color: white; /* Ícones brancos como na foto */
}

.close-sidebar {
    position: absolute;
    top: 15px;
    right: 20px;
    color: white;
    font-size: 1.5rem;
    background: transparent;
    border: none;
    cursor: pointer;
}

/* Linhas de seleção de tema dentro do menu expandido */
.theme-select-row {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    color: #bbb;
    font-size: 0.9rem;
    font-weight: 500;
    transition: background 0.2s;
}

.theme-select-row:hover {
    background: rgba(255,255,255,0.05);
    color: white;
}

/* Botão de Salvar Premium */
.save-settings-btn {
    width: 100%;
    margin-top: 25px;
    background: #e50914; /* Vermelho Tixan */
    color: white;
    padding: 16px;
    border-radius: 16px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    box-shadow: 0 10px 20px rgba(229, 9, 20, 0.2);
    transition: all 0.2s;
}

.save-settings-btn:active {
    transform: scale(0.96);
    background: #c40812;
}
        #mobileSearchRow { position: fixed; top: 70px; left: 0; width: 100%; z-index: 999; display: none; }
        #mobileSearchRow.active { display: block; padding: 0 20px; }

        #librarySection { padding: 30px 20px; }
        #librarySection h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 20px; border-left: 4px solid var(--primary-red); padding-left: 10px; }
        #bookList { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; justify-content: center; }

        .book-card-modern {
            position: relative;
            height: 280px;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.7);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .book-card-modern:hover { transform: translateY(-5px) scale(1.02); box-shadow: 0 8px 20px rgba(229, 9, 20, 0.7); }

        .card-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.7) 40%, rgba(0,0,0,0) 100%);
            display: flex; flex-direction: column; justify-content: flex-end; padding: 15px;
        }

        .card-title { font-size: 1.1rem; font-weight: 700; line-height: 1.2; margin-bottom: 2px; }
        .card-author { font-size: 0.85rem; color: var(--light-text); margin-bottom: 12px; }

        .card-actions { display: flex; gap: 8px; }
        .read-btn { flex-grow: 1; display: flex; justify-content: center; align-items: center; background-color: var(--primary-red); color: var(--text-color); padding: 8px 5px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
        .info-btn, .remove-btn { background-color: rgba(255, 255, 255, 0.1); color: var(--text-color); padding: 8px; border: none; border-radius: 6px; cursor: pointer; width: 35px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: flex-start; z-index: 3000; overflow-y: auto; padding-top: 50px; }
        .modal-content { background-color: var(--card-bg); border-radius: 10px; width: 90%; max-width: 600px; padding: 25px; position: relative; }
        .form-input, .form-textarea { width: 100%; padding: 10px; border: 1px solid #333; border-radius: 5px; background-color: var(--input-bg); color: #fff; margin-bottom: 15px; box-sizing: border-box; }
        .file-drop-area { border: 2px dashed #444; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; background-color: var(--input-bg); margin-bottom: 15px; }

        #descriptionModal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.9); display: none; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(5px); }
        .desc-header { display: flex; align-items: flex-start; gap: 20px; margin-bottom: 20px; }
        .desc-cover { width: 150px; height: 200px; object-fit: cover; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .desc-text-content { font-size: 0.95rem; line-height: 1.6; color: var(--light-text); border-top: 1px solid #333; padding-top: 20px; }

        @media (max-width: 768px) {
            #top-utility-container { width: calc(100% - 40px); justify-content: space-between; left: 20px; right: 20px; }
            #searchContainer, #addBookBtn, #logoutBtn, #adminPanelBtn { display: none !important; }
            .icon-btn { display: block; }
            .welcome-message { display: none; } 
            #bookList { grid-template-columns: repeat(2, 1fr); gap: 15px; }
            .book-card-modern { height: 220px; }
            .hero-content h2 { font-size: 1.8rem; }
        }
        .submenu-wrapper {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.3s ease-out;
    background-color: rgba(0, 0, 0, 0.2);
    border-radius: 12px;
}
.submenu-inner {
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 12px; /* Espaço entre os botões de tema */
}
    </style>
</head>

</div>
</div>

            <p id="featuredSummary" style="max-width: 450px; margin: 20px auto; font-size: 0.95rem;"></p>
            <div class="hero-buttons">
                <button id="readFeaturedBtn" class="primary-btn" style="display:none;"><i class="fa-solid fa-play"></i> Ler Agora</button>
            </div>
        </div>
    </div>

    <div id="librarySection">
        <h2 id="collectionTitle">Sua Coleção</h2>
        <div id="bookList"></div>
    </div>

    <div id="addBookModal" class="modal-overlay">
        <div class="modal-content">
            <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:20px;">
                <h2>Adicionar Livro</h2>
                <span onclick="closeModal()" style="cursor:pointer; font-size: 2rem;">&times;</span>
            </div>
            <form id="bookForm">
                <div class="file-drop-area" onclick="document.getElementById('epubFileInput').click()">
                    <i class="fa-solid fa-upload"></i>
                    <p id="epubFileStatus">Clique para selecionar arquivo .epub</p>
                </div>
                <input type="text" id="bookTitleInput" class="form-input" placeholder="Título *" required>
                <input type="text" id="bookAuthorInput" class="form-input" placeholder="Autor *" required>
                <textarea id="bookDescriptionInput" class="form-textarea" placeholder="Descrição" rows="4"></textarea>
                <div style="display:flex; justify-content: flex-end; gap: 10px;">
                    <button type="button" onclick="closeModal()" style="background:#444; color:white; padding:10px; border-radius:5px; border:none; cursor:pointer;">Cancelar</button>
                    <button type="submit" id="submitBookBtn" style="background:var(--primary-red); color:white; padding:10px 20px; border-radius:5px; border:none; font-weight:bold; cursor:pointer;">Adicionar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="descriptionModal">
        <div class="modal-content">
            <span onclick="closeDescriptionModal()" style="position:absolute; top:15px; right:15px; font-size:2rem; cursor:pointer; color:var(--light-text);">&times;</span>
            <div class="desc-header">
                <img id="descCover" class="desc-cover" src="">
                <div class="desc-info" style="flex-grow:1; margin-left: 20px;">
                    <h3 id="descTitle" style="font-size:2rem; font-weight:700;"></h3>
                    <p id="descAuthor" style="color:var(--light-text);"></p>
                    <button id="descReadBtn" class="read-btn" style="max-width: 150px; margin-top:15px;">Ler Agora</button>
                </div>
            </div>
            <div id="descDescription" class="desc-text-content" style="border-top: 1px solid #333; margin-top: 20px; padding-top: 20px;"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs/dist/epub.min.js"></script>

<script type="module">
        import { auth, db } from './firebase-config.js';
        import { supabase } from './supabase-config.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc, getDocs, query, where, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let currentCoverBase64 = null;
        let currentEpubArrayBuffer = null;


window.toggleSubMenu = (id) => {
    const menu = document.getElementById(id);
    const arrow = document.getElementById('theme-arrow');
    
    // Se o menu estiver fechado (altura 0), nós abrimos
    if (!menu.style.maxHeight || menu.style.maxHeight === "0px") {
        menu.style.maxHeight = menu.scrollHeight + "px"; // Abre até o tamanho do conteúdo
        arrow.style.transform = 'rotate(90deg)';
    } else {
        menu.style.maxHeight = "0px"; // Esconde tudo
        arrow.style.transform = 'rotate(0deg)';
    }
};

    window.openSettingsModal = () => {
        // Fecha a sidebar antes de abrir as configs para evitar bugs visuais
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        if(sidebar.classList.contains('active')) {
            sidebar.classList.remove('active');
            overlay.style.display = 'none';
        }
        document.getElementById('settingsModal').style.display = 'flex';
    };

    window.closeSettingsModal = () => {
        document.getElementById('settingsModal').style.display = 'none';
        // Se houver um menu de temas aberto, vamos fechá-lo para a próxima vez
        const menu = document.getElementById('theme-options');
        const arrow = document.getElementById('theme-arrow');
        menu.classList.add('hidden');
        arrow.style.transform = 'rotate(0deg)';
    };
// --- PENTE FINO: FUNCIONALIDADE DE TEMAS ---
window.applyTheme = (theme) => {
    // 1. Salva a preferência para o reader.html ler depois
    localStorage.setItem('staant_theme', theme);

    // 2. (Opcional) Feedback visual imediato nos botões do modal
    const buttons = document.querySelectorAll('.theme-sub-btn');
    buttons.forEach(btn => {
        btn.style.borderColor = 'rgba(255, 255, 255, 0.1)';
        btn.style.color = '#9ca3af';
    });

    // Destaca o botão clicado
    const selectedBtn = event.currentTarget;
    selectedBtn.style.borderColor = 'var(--primary-red)';
    selectedBtn.style.color = '#fff';

    console.log(`Tema ${theme} selecionado e salvo!`);
};
        // --- INTERFACE (Globais) ---
        window.toggleSidebar = () => {
            const side = document.getElementById('sidebar');
            side.classList.toggle('active');
            const overlay = document.getElementById('sidebarOverlay');
            overlay.style.display = side.classList.contains('active') ? 'block' : 'none';
        };

        window.toggleSearchMobile = () => {
            document.getElementById('mobileSearchRow').classList.toggle('active');
        };

        window.openAddModal = () => { 
            if(document.getElementById('sidebar').classList.contains('active')) toggleSidebar(); 
            document.getElementById('addBookModal').style.display = 'flex'; 
        };

        window.closeModal = () => { 
            document.getElementById('addBookModal').style.display = 'none'; 
            document.getElementById('bookForm').reset(); 
            currentEpubArrayBuffer = null; 
            currentCoverBase64 = null; 
            document.getElementById('epubFileStatus').textContent = "Clique para selecionar arquivo .epub";
        };

        window.closeDescriptionModal = () => { document.getElementById('descriptionModal').style.display = 'none'; };

        window.logout = async () => {
            await signOut(auth);
            localStorage.clear();
            window.location.href = 'login.html';
        };
window.openSettingsModal = () => {
    // Fecha a sidebar se estiver aberta
    if(document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
    document.getElementById('settingsModal').style.display = 'flex';
};

window.closeSettingsModal = () => {
    document.getElementById('settingsModal').style.display = 'none';
};
        // --- SISTEMA (NUVEM TOTAL) ---
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            const savedUser = JSON.parse(localStorage.getItem('staant_user'));
            if (savedUser) {
                document.getElementById('userWelcome').innerHTML = `Olá, <b>${savedUser.name.split(' ')[0]}</b>`;
                if(savedUser.role === 'admin') {
                    document.getElementById('adminPanelBtn').style.display = 'block';
                    document.getElementById('adminSidebarItem').style.display = 'flex';
                }
            }

            renderList();
        });

        // --- RENDERIZAR DA NUVEM (FIRESTORE) ---
        window.renderList = async (filter = '') => {
            const currentUser = JSON.parse(localStorage.getItem('staant_user'));
            if (!currentUser) return;

            const bookList = document.getElementById('bookList');
            
            try {
                const booksRef = collection(db, "books");
                let q;

                // Admin vê tudo, User vê apenas o seu
                if (currentUser.role === 'admin') {
                    q = query(booksRef, orderBy("timestamp", "desc"));
                } else {
                    q = query(booksRef, where("userId", "==", currentUser.id), orderBy("timestamp", "desc"));
                }

                const querySnapshot = await getDocs(q);
                
                // --- ATUALIZAR CONTADOR (PENTE FINO) ---
                const counterDisplay = document.getElementById('storedBooksCount');
                if (counterDisplay) {
                    counterDisplay.textContent = querySnapshot.size;
                }

                bookList.innerHTML = '';
                const term = filter.toLowerCase();
                let firstBook = null;

                querySnapshot.forEach((docSnap) => {
                    const book = { id: docSnap.id, ...docSnap.data() };
                    if (book.title.toLowerCase().includes(term) || book.author.toLowerCase().includes(term)) {
                        if (!firstBook) firstBook = book;
                        bookList.appendChild(createCard(book));
                    }
                });

                updateHero(firstBook);
                document.getElementById('loadingOverlay').classList.add('hidden');
            } catch (error) {
                console.error("Erro ao carregar:", error);
                document.getElementById('loadingOverlay').classList.add('hidden');
            }
        };

        function createCard(book) {
            const div = document.createElement('div');
            div.className = 'book-card-modern';
            div.style.backgroundImage = `url('${book.cover || ''}')`;
            div.innerHTML = `
                <div class="card-overlay">
                    <p class="card-title">${book.title}</p>
                    <p class="card-author">${book.author}</p>
                    <div class="card-actions">
                        <button class="read-btn" onclick="openReader('${book.epubUrl}')">Ler</button>
                        <button class="info-btn" onclick='showInfoByIndex(${JSON.stringify(book)})'><i class="fa-solid fa-info"></i></button>
                        <button class="remove-btn" onclick="deleteBookCloud('${book.id}', '${book.storagePath}')"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            `;
            return div;
        }

        window.openReader = (url) => { 
            localStorage.setItem('currentEpubUrl', url); 
            window.location.href = 'reader.html'; 
        };

        window.deleteBookCloud = async (id, path) => {
            if(confirm("Excluir permanentemente da nuvem?")) {
                try {
                    if (path) {
                        await supabase.storage.from('biblioteca').remove([path]);
                    }
                    await deleteDoc(doc(db, "books", id));
                    renderList();
                } catch (e) { console.error(e); }
            }
        };

        window.showInfoByIndex = (book) => {
            document.getElementById('descTitle').textContent = book.title;
            document.getElementById('descAuthor').textContent = book.author;
            document.getElementById('descDescription').textContent = book.description;
            document.getElementById('descCover').src = book.cover || '';
            document.getElementById('descReadBtn').onclick = () => openReader(book.epubUrl);
            document.getElementById('descriptionModal').style.display = 'flex';
        };

        function updateHero(book) {
            const fTitle = document.getElementById('featuredTitle');
            const fAuthor = document.getElementById('featuredAuthor');
            const fSummary = document.getElementById('featuredSummary');
            const fBtn = document.getElementById('readFeaturedBtn');
            if (book) {
                fTitle.textContent = book.title;
                fAuthor.textContent = `por ${book.author}`;
                fSummary.textContent = book.description ? book.description.substring(0, 150) + "..." : "Sem descrição.";
                fBtn.onclick = () => openReader(book.epubUrl);
                fBtn.style.display = "block";
            } else {
                fTitle.textContent = "Sua Estante";
                fAuthor.textContent = "";
                fSummary.textContent = "Adicione um livro para começar.";
                fBtn.style.display = "none";
            }
        }

        // --- FUNÇÃO DE COMPRESSÃO (PENTE FINO) ---
        async function compressCover(base64Str) {
            if (!base64Str) return "";
            return new Promise((resolve) => {
                const img = new Image();
                img.src = base64Str;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 250; 
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * scaleSize;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.4));
                };
                img.onerror = () => resolve("");
                setTimeout(() => resolve(""), 5000);
            });
        }

        // --- UPLOAD HÍBRIDO ---
        document.getElementById('bookForm').onsubmit = async (e) => {
            e.preventDefault();
            if (!currentEpubArrayBuffer) return alert("Processando arquivo...");
            
            const btn = document.getElementById('submitBookBtn');
            btn.disabled = true; 
            btn.textContent = "Sincronizando...";

            const user = JSON.parse(localStorage.getItem('staant_user'));
            const title = document.getElementById('bookTitleInput').value;
            const author = document.getElementById('bookAuthorInput').value;

            try {
                let optimizedCover = await compressCover(currentCoverBase64);
                if (optimizedCover.length > 500000) optimizedCover = "";

                // Limpeza de nome para Supabase
                const cleanTitle = title.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]/g, "_").toLowerCase();
                const storagePath = `${user.id}/${Date.now()}_${cleanTitle}.epub`;
                const fileBlob = new Blob([currentEpubArrayBuffer], { type: 'application/epub+zip' });

                const { error } = await supabase.storage.from('biblioteca').upload(storagePath, fileBlob);
                if (error) throw error;

                const { data: urlData } = supabase.storage.from('biblioteca').getPublicUrl(storagePath);
                
                await addDoc(collection(db, "books"), {
                    userId: user.id,
                    title, 
                    author,
                    description: document.getElementById('bookDescriptionInput').value,
                    epubUrl: urlData.publicUrl,
                    storagePath: storagePath,
                    cover: optimizedCover, 
                    timestamp: Date.now()
                });

                closeModal();
                renderList();
            } catch (err) {
                console.error(err);
                alert("Erro ao subir para a nuvem.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Adicionar";
            }
        };

        document.getElementById('epubFileInput').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('epubFileStatus').textContent = "Processando...";
            const reader = new FileReader();
            reader.onload = async (ev) => {
                currentEpubArrayBuffer = ev.target.result;
                const epub = ePub(currentEpubArrayBuffer);
                const meta = await epub.loaded.metadata;
                document.getElementById('bookTitleInput').value = meta.title || "";
                document.getElementById('bookAuthorInput').value = meta.creator || "";
                document.getElementById('bookDescriptionInput').value = (meta.description || "").replace(/<[^>]*>?/gm, '');
                
                const cUrl = await epub.coverUrl();
                if (cUrl) {
                    const res = await fetch(cUrl);
                    const blob = await res.blob();
                    const readB = new FileReader();
                    readB.onloadend = () => { currentCoverBase64 = readB.result; };
                    readB.readAsDataURL(blob);
                }
                document.getElementById('epubFileStatus').textContent = "Arquivo Pronto!";
            };
            reader.readAsArrayBuffer(file);
        };

        document.getElementById('searchInput').oninput = (e) => renderList(e.target.value);
        
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
