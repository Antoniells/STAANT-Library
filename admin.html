<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/50/e50914/book-stack.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/150/e50914/book-stack.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - STAANT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        :root {
            --primary-red: #e50914;
            --dark-bg: #121212;
            --card-bg: #1f1f1f;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--dark-bg);
            color: #fff;
            margin: 0;
            overflow-x: hidden;
        }
        .admin-table th {
            text-align: left;
            border-bottom: 1px solid #333;
            padding: 12px;
            color: #aaa;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 1px;
        }
        .admin-table td {
            padding: 15px 12px;
            border-bottom: 1px solid #262626;
            word-break: break-word;
            overflow-wrap: anywhere;
        }
        .stat-card {
            background-color: var(--card-bg);
            border-left: 4px solid var(--primary-red);
            transition: transform 0.3s ease;
        }
        .stat-card:hover { transform: translateY(-5px); }

        @media (max-width: 640px) {
            .admin-table thead { display: none; }
            .admin-table, .admin-table tbody, .admin-table tr, .admin-table td { display: block; width: 100%; }
            .admin-table tr { margin-bottom: 15px; background: #1f1f1f; border-radius: 12px; padding: 15px; border: 1px solid #333; }
            .admin-table td { text-align: right; padding-left: 40%; position: relative; border-bottom: 1px solid #262626; min-height: 45px; display: flex; align-items: center; justify-content: flex-end; }
            .admin-table td:last-child { border-bottom: none; }
            .admin-table td::before { content: attr(data-label); position: absolute; left: 10px; width: 35%; font-weight: bold; text-align: left; color: var(--primary-red); font-size: 0.7rem; text-transform: uppercase; }
            .email-cell { font-size: 0.8rem !important; word-break: break-all; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
        <div>
            <h1 class="text-3xl font-bold text-red-600 tracking-tighter">STAANT <span class="text-white font-light">ADMIN</span></h1>
            <p class="text-gray-400 text-sm">Controle de usuários em tempo real (Firestore)</p>
        </div>
        <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto">
            <button onclick="window.location.href='index.html'" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-3 md:py-2 rounded-lg font-medium transition flex items-center justify-center gap-2 w-full sm:w-auto">
                <i class="fa-solid fa-eye"></i> Ver Biblioteca
            </button>
            <button id="btnLogout" class="bg-gray-800 hover:bg-gray-700 text-white px-5 py-3 md:py-2 rounded-lg font-medium transition flex items-center justify-center gap-2 w-full sm:w-auto">
                <i class="fa-solid fa-right-from-bracket"></i> Sair
            </button>
        </div>
    </header>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mb-12">
        <div class="stat-card p-6 rounded-xl shadow-2xl">
            <p class="text-gray-500 text-xs font-bold uppercase tracking-widest">Usuários na Nuvem</p>
            <h3 id="totalUsers" class="text-4xl font-bold mt-2">0</h3>
        </div>
        <div class="stat-card p-6 rounded-xl shadow-2xl">
            <p class="text-gray-500 text-xs font-bold uppercase tracking-widest">Livros Armazenados</p>
            <h3 id="totalBooks" class="text-4xl font-bold mt-2">0</h3>
        </div>
        <div class="stat-card p-6 rounded-xl shadow-2xl">
            <p class="text-gray-500 text-xs font-bold uppercase tracking-widest">Status da Base</p>
            <h3 class="text-2xl font-bold mt-2 text-green-500 flex items-center gap-2">
                <span class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></span> Firebase Online
            </h3>
        </div>
    </div>

    <div class="bg-[#1a1a1a] rounded-2xl shadow-2xl border border-gray-800 overflow-hidden">
        <div class="p-6 border-b border-gray-800 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 bg-[#1f1f1f]">
            <h2 class="text-xl font-bold flex items-center gap-3">
                <i class="fa-solid fa-users text-red-600"></i> Gerenciar Usuários
            </h2>
            <span class="text-xs text-gray-500">Dados protegidos no Firestore</span>
        </div>
        
        <div class="table-container overflow-x-auto max-h-[600px]">
            <table class="w-full admin-table">
                <thead>
                    <tr class="bg-[#1f1f1f]">
                        <th>Nome Completo</th>
                        <th>E-mail</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    </tbody>
            </table>
        </div>
        
        <div id="noUsersMsg" class="hidden p-10 text-center text-gray-600 italic">
            Nenhum usuário cadastrado no Firestore.
        </div>
    </div>

<script type="module">
        import { auth, db } from './firebase-config.js';
        import { 
            collection, 
            getDocs, 
            doc, 
            deleteDoc, 
            updateDoc, 
            query, 
            orderBy 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const ADMIN_EMAIL = "admin@staant.com";
        const DB_LOCAL_NAME = 'STAANT_DB';
        const STORE_NAME = 'books';

        // 1. Proteção de Acesso
        function checkAdmin() {
            const user = JSON.parse(localStorage.getItem('staant_user'));
            if (!user || user.role !== 'admin') {
                alert("Acesso negado.");
                window.location.href = 'login.html';
            }
        }

        // 2. Carregar Usuários e Estatísticas (PENTE FINO)
        async function loadAdminData() {
            const tbody = document.getElementById('userTableBody');
            const noUsersMsg = document.getElementById('noUsersMsg');
            if(tbody) tbody.innerHTML = '<tr><td colspan="3" class="text-center p-10 text-gray-500">Buscando dados no Firebase...</td></tr>';

            try {
                // --- BUSCA USUÁRIOS ---
                const qUsers = query(collection(db, "users"), orderBy("name"));
                const usersSnapshot = await getDocs(qUsers);
                
                let userCount = 0;
                if(tbody) tbody.innerHTML = '';

                usersSnapshot.forEach((docSnap) => {
                    const user = docSnap.data();
                    userCount++;

                    if (user.email === ADMIN_EMAIL) return;

                    if(tbody) {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td data-label="Nome" class="font-semibold text-gray-200">${user.name}</td>
                            <td data-label="E-mail" class="text-gray-400 font-mono text-sm email-cell">${user.email}</td>
                            <td data-label="Ações">
                                <div class="flex gap-6 sm:gap-4 justify-end sm:justify-start">
                                    <button onclick="window.editUser('${user.uid}', '${user.name}')" class="text-blue-400 hover:text-blue-300 transition">
                                        <i class="fa-solid fa-pen-to-square"></i>
                                    </button>
                                    <button onclick="window.deleteUser('${user.uid}', '${user.name}')" class="text-red-500 hover:text-red-400 transition">
                                        <i class="fa-solid fa-trash-can"></i>
                                    </button>
                                </div>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    }
                });

                // Atualiza contador de usuários na tela
                const totalUsersEl = document.getElementById('totalUsers');
                if (totalUsersEl) totalUsersEl.textContent = userCount;
                if (userCount === 0 && noUsersMsg) noUsersMsg.classList.remove('hidden');

                // --- BUSCA LIVROS (CONTAGEM GLOBAL NA NUVEM) ---
                const booksSnapshot = await getDocs(collection(db, "books"));
                const totalBooksEl = document.getElementById('totalBooks');
                if (totalBooksEl) totalBooksEl.textContent = booksSnapshot.size;

            } catch (error) {
                console.error("Erro Admin Firestore:", error);
                if(tbody) tbody.innerHTML = '<tr><td colspan="3" class="text-center text-red-500 p-10">Erro ao conectar com o banco de dados.</td></tr>';
            }
        }

        // 3. Funções Globais de Gerenciamento
        window.deleteUser = async (uid, name) => {
            if (confirm(`Excluir permanentemente o usuário ${name}?\nEle perderá acesso à biblioteca.`)) {
                try {
                    await deleteDoc(doc(db, "users", uid));
                    alert("Usuário removido do banco.");
                    loadAdminData();
                } catch (e) { alert("Erro ao excluir."); }
            }
        };

        window.editUser = async (uid, currentName) => {
            const newName = prompt("Editar nome do usuário:", currentName);
            if (newName && newName.trim() !== "" && newName !== currentName) {
                try {
                    await updateDoc(doc(db, "users", uid), { name: newName.trim() });
                    loadAdminData();
                } catch (e) { alert("Erro ao atualizar."); }
            }
        };

        // 4. Logout Firebase
        const btnLogout = document.getElementById('btnLogout');
        if (btnLogout) {
            btnLogout.onclick = async () => {
                await signOut(auth);
                localStorage.clear();
                window.location.href = 'login.html';
            };
        }

        // Inicialização
        checkAdmin();
        loadAdminData();

    </script>
</body>
</html>
