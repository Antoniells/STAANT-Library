<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/50/e50914/book-stack.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/150/e50914/book-stack.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - STAANT</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-red: #e50914; 
            --dark-bg: #121212; 
            --card-bg: #1f1f1f; 
            --input-bg: #333333; 
            --text-color: #fff; 
        }
        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: var(--dark-bg); 
            color: var(--text-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .container { 
            background-color: var(--card-bg); 
            padding: 40px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 400px; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* --- ESTILO DA ÁREA DE MENSAGENS --- */
        #messageArea {
            min-height: 20px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            border-radius: 8px;
            padding: 12px;
            display: none;
            font-weight: 500;
        }
        .error-msg {
            background-color: rgba(229, 9, 20, 0.15);
            color: #ff4d4d;
            border: 1px solid var(--primary-red);
        }
        .success-msg {
            background-color: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid #22c55e;
        }

        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid transparent; 
            background: var(--input-bg); 
            color: white; 
            box-sizing: border-box; 
            outline: none;
        }
        input:focus { border-color: var(--primary-red); }
        button { 
            width: 100%; 
            padding: 12px; 
            background: var(--primary-red); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background: #f87171; }
        button:disabled { background: #555; cursor: not-allowed; }
        .links { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        a { color: #ccc; text-decoration: none; font-size: 0.85rem; }
        a:hover { text-decoration: underline; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: var(--primary-red); margin-bottom: 10px; font-size: 2.5rem; letter-spacing: 2px;">STAANT</h1>
        <p style="color: #aaa; margin-bottom: 20px; font-size: 0.9rem;">Crie sua conta na nuvem</p>
        
        <div id="messageArea"></div>

        <form id="registerForm">
            <input type="text" id="name" placeholder="Nome Completo" required>
            <input type="email" id="email" placeholder="E-mail" required>
            <input type="password" id="password" placeholder="Senha (mín. 6 caracteres)" required minlength="6">
            <input type="password" id="confirmPassword" placeholder="Confirmar Senha" required minlength="6">
            <button type="submit" id="btnRegister">Cadastrar</button>
        </form>

        <div class="links">
            <a href="login.html">Já tem uma conta? Entre aqui</a>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { 
            createUserWithEmailAndPassword, 
            updateProfile,
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            doc, 
            setDoc 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const registerForm = document.getElementById('registerForm');
        const btnRegister = document.getElementById('btnRegister');
        const messageArea = document.getElementById('messageArea');

        // Função para exibir mensagens na tela
        function showMessage(text, type = 'error') {
            messageArea.textContent = text;
            messageArea.className = type === 'error' ? 'error-msg' : 'success-msg';
            messageArea.style.display = 'block';
        }

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            messageArea.style.display = 'none';

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage("As senhas não coincidem!");
                return;
            }

            btnRegister.disabled = true;
            btnRegister.textContent = "Processando...";

            try {
                // 1. Cria usuário no Authentication
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // 2. Salva o Nome no Perfil do Auth
                await updateProfile(user, { displayName: name });

                // 3. Salva os dados no Firestore Database
                await setDoc(doc(db, "users", user.uid), {
                    uid: user.uid,
                    name: name,
                    email: email.toLowerCase().trim(),
                    role: "user",
                    createdAt: new Date()
                });

                // 4. Limpeza e Sucesso
                await signOut(auth);
                localStorage.removeItem('staant_user');
                localStorage.removeItem('staant_logged');

                showMessage("Conta criada com sucesso! Redirecionando...", "success");

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error("Erro detalhado:", error);
                btnRegister.disabled = false;
                btnRegister.textContent = "Cadastrar";

                let msg = "Erro ao cadastrar.";
                if (error.code === 'auth/email-already-in-use') msg = "Este e-mail já está sendo usado.";
                if (error.code === 'auth/weak-password') msg = "A senha deve ter pelo menos 6 caracteres.";
                if (error.code === 'auth/invalid-email') msg = "E-mail em formato inválido.";
                
                showMessage(msg, "error");
            }
        });
    </script>
</body>
</html>
