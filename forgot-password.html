<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/50/e50914/book-stack.png">
    <link rel="apple-touch-icon" href="https://img.icons8.com/ios-filled/150/e50914/book-stack.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - STAANT</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-red: #e50914; 
            --dark-bg: #121212; 
            --card-bg: #1f1f1f; 
            --input-bg: #333333; 
            --text-color: #fff; 
        }
        body { 
            font-family: 'Roboto', sans-serif; 
            color: var(--text-color); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            /* Fundo estilo Netflix com textura de livros */
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,1) 100%), 
                        url('https://images.unsplash.com/photo-1507842217343-583bb7270b66?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
        }
        .container { 
            background-color: rgba(0, 0, 0, 0.75); 
            padding: 40px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 400px; 
            backdrop-filter: blur(5px);
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        #messageArea {
            min-height: 20px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            border-radius: 8px;
            padding: 12px;
            display: none;
            font-weight: 500;
        }
        .error-msg { background-color: rgba(229, 9, 20, 0.15); color: #ff4d4d; border: 1px solid var(--primary-red); }
        .success-msg { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid #22c55e; }

        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid transparent; 
            background: var(--input-bg); 
            color: white; 
            box-sizing: border-box; 
            outline: none;
        }
        input:focus { border-color: var(--primary-red); }
        button { 
            width: 100%; 
            padding: 12px; 
            background: var(--primary-red); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background: #d41821; }
        button:disabled { background: #555; cursor: not-allowed; }
        .links { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        a { color: #ccc; text-decoration: none; font-size: 0.85rem; }
        a:hover { text-decoration: underline; color: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: var(--primary-red); margin-bottom: 10px; font-size: 2.5rem; letter-spacing: 2px;">STAANT</h1>
        <p style="color: #aaa; margin-bottom: 20px; font-size: 0.9rem;">Recuperação de Acesso</p>
        
        <div id="messageArea"></div>

        <form id="forgotForm">
            <input type="email" id="email" placeholder="Digite seu e-mail cadastrado" required>
            <button type="submit" id="btnRecover">Enviar link de recuperação</button>
        </form>

        <div class="links">
            <a href="login.html">Voltar para o Login</a>
        </div>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const forgotForm = document.getElementById('forgotForm');
        const btnRecover = document.getElementById('btnRecover');
        const messageArea = document.getElementById('messageArea');

        function showMessage(text, type = 'error') {
            messageArea.textContent = text;
            messageArea.className = type === 'error' ? 'error-msg' : 'success-msg';
            messageArea.style.display = 'block';
        }

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();

            messageArea.style.display = 'none';
            btnRecover.disabled = true;
            btnRecover.textContent = "Enviando...";

            try {
                // Lógica de Pente Fino: Envio de e-mail de recuperação
                await sendPasswordResetEmail(auth, email);
                
                showMessage("Link enviado! Verifique sua caixa de entrada (e o spam).", "success");
                btnRecover.textContent = "E-mail Enviado";

            } catch (error) {
                console.error("Erro ao recuperar:", error.code);
                btnRecover.disabled = false;
                btnRecover.textContent = "Enviar link de recuperação";

                let msg = "Erro ao processar solicitação.";
                if (error.code === 'auth/user-not-found') msg = "Este e-mail não está cadastrado.";
                if (error.code === 'auth/invalid-email') msg = "E-mail em formato inválido.";
                
                showMessage(msg, "error");
            }
        });
    </script>
</body>
</html>
