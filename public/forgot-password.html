<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="icon" type="image/png" href="icons/icon-50.png">
    <link rel="apple-touch-icon" href="icons/icon-150.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha - STAANT</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/forgot-password.css">
</head>
<body>
    <div class="container">
        <h1 style="color: var(--primary-red); margin-bottom: 10px; font-size: 2.5rem; letter-spacing: 2px;">STAANT</h1>
        <p style="color: #aaa; margin-bottom: 20px; font-size: 0.9rem;">Recuperação de Acesso</p>
        
        <div id="messageArea"></div>

        <form id="forgotForm">
            <input type="email" id="email" placeholder="Digite seu e-mail cadastrado" required>
            <button type="submit" id="btnRecover">Enviar link de recuperação</button>
        </form>

        <div class="links">
            <a href="login.html">Voltar para o Login</a>
        </div>
    </div>

    <script type="module" src="js/forgot-password.js"></script>
</body>
</html>
